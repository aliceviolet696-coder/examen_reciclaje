spring.application.name=reciclaje-api

# ------------------------------------------------------------------
# Conexión a PostgreSQL (reciclaje_db).
# Las credenciales se leen de variables de entorno para no publicar
# contraseñas en el repositorio. Los valores por defecto son de
# ejemplo; ajuste DB_USER y DB_PASSWORD en su equipo.
#
# PowerShell:
#   $env:DB_USER="postgres"; $env:DB_PASSWORD="su_clave"
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reciclaje_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate crea/actualiza la tabla puntos_reciclaje automáticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
server.error.include-message=always
